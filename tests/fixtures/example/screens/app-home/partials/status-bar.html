<!-- System status bar. Sits inside the top safe area (var(--safe-top)). -->
<div class="absolute inset-x-0 top-0 z-50 flex items-end justify-between px-8 pb-3 text-[17px] font-semibold tracking-tight"
     style="height: var(--safe-top)">
  <span class="w-14 text-center tabular-nums">9:41</span>
  <span class="flex items-center gap-1.5">
    <i data-lucide="signal" class="size-[18px]" stroke-width="2.5"></i>
    <i data-lucide="wifi" class="size-[18px]" stroke-width="2.5"></i>
    <i data-lucide="battery-full" class="size-6" stroke-width="2"></i>
  </span>
</div>
